services:

  backend:
    build: 
      context: ./backend
    # image: visheshsoni099/legalflow-backend:latest
    container_name: legalflow-backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: legalflow-db.cvsuu4y8iyy8.ap-southeast-2.rds.amazonaws.com
      DB_PORT: 5432
      DB_NAME: legalflow
      DB_USER: postgres
      NODE_ENV: production
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    restart: always

  frontend:
    build: 
      context: ./LegalFlow
      dockerfile: DockerFile
    # image: visheshsoni099/legalflow-frontend:latest
    container_name: legalflow-frontend
    env_file: 
      - ./LegalFlow/.env
    ports:
      - "80:80"
    depends_on:
      - backend

    restart: always
  
networks:
  default:
    driver: bridge

